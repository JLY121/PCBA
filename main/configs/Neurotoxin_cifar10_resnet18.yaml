program: sweep_interface.py
method: grid
name: clean
metric:
    name: bkd_acc
    goal: maximize
parameters:
    attack_type:
        value: 'Neurotoxin'  # A3FL/BadNets/Chameleon/Neurotoxin/Our
    dataset:
        value: 'cifar10' 
    in_channels:         
        value: 3
    image_size:         
        value: 32
    model:
        value: 'resnet18'
    agg_method:
        value: 'avg'    # avg/clip/krum/multi_krum/crfl/foolsgold/flame/feddmc/indicator/alignins
    is_poison:
        value: true
    load_benign_model:
        value: true
    two_stage_training:  # 后门注入时是否先进行良性训练
        value: false
    seed:
        value: 0
    lr:
        value: 0.01
    gamma:
        value: 1
    lr_method:
        value: 'linear' # linear/exp/warmup_cosine
    target_lr:
        value: 0.02
    momentum: 
        value: 0.9
    decay: 
        value: 0.0005
    batch_size:
        value: 64
    test_batch_size:
        value: 1024
    num_worker:
        value: 0
    poison_start_epoch:
        value: 1900 #  ←  随时准备攻击，但只有在is_poison为True时才会真正开始攻击
    epochs:          # 总的训练轮次
        value: 3101 
    poison_epochs:   #===攻击训练轮次===
        value: 100
    num_total_participants:    #参与FL的总客户端数
        value: 100
    num_adversaries:           #恶意客户端数
        value: 1
    num_sampled_participants:  #每轮参与FL的客户端数
        value: 10
    sample_method:             #客户端选择策略
        value: 'random'
    sample_poison_ratio:   #random_update中每轮参与FL的恶意客户端数
        value: 0
    dirichlet_alpha:
        value: 0.9
    retrain_times:
        value: 2
    attacker_retrain_times:
        value: 2
    save_every:                #每隔多少轮保存一次模型
        value: 3333
    trigger_size_h:
        value: 7     # 触发器的高度
    trigger_size_w:
        value: 7     # 触发器的宽度
    attacker_method:
        value: 'sin-adv'
    malicious_update_method:
        value: 'label'
    clip_factor:
        value: 1
    attacker_lr_decay:
        value: 5
    target_class:         # target class
        value: 2
    bkd_ratio:            # poison ratio
        value: 0.25      
    adv_loss:
        value: 'ce'
    wp_factor:
        value: 0.05
    # ============== Neurotoxin 攻击方法专用参数 ==============
    neurotoxin_poison_lr:           # Neurotoxin 后门训练学习率
        value: 0.01
    neurotoxin_poison_momentum:     # Neurotoxin 后门训练动量
        value: 0.9
    neurotoxin_poison_decay:        # Neurotoxin 后门训练权重衰减
        value: 0.0005
    neurotoxin_gradmask_ratio:      # 梯度掩码比例 - 控制参数更新的选择性，越小越隐蔽
        value: 0.97
    neurotoxin_retrain_poison:      # 后门训练轮数 - 控制攻击强度
        value: 10
    neurotoxin_aggregate_all_layer: # 是否对所有层进行聚合掩码计算
        value: 1
    neurotoxin_num_clean_data:      # 用于计算掩码的良性数据数量（最大批次）
        value: 30
    neurotoxin_max_batches_per_epoch: # 每个内部训练轮次的最大批次数
        value: 50
    
    #============Indicator聚合方法相关参数=============
    # 水印检测轮次相关参数
    watermarking_start_round:
        value: 0  # 开始进行水印检测的轮次
    watermarking_end_round:
        value: 3000  # 结束水印检测的轮次
    watermarking_round_interval:
        value: 1    # 水印检测的间隔轮次
    # 水印注入相关参数
    watermarking_mu:
        value: 0.01  # 水印损失函数中的权重系数
    global_lr:
        value: 0.001 # 水印注入时的学习率
    global_momentum:
        value: 0.9   # 水印注入时的动量
    global_weight_decay:
        value: 0.0005 # 水印注入时的权重衰减
    global_lr_gamma:
        value: 0.1   # 学习率衰减系数
    global_retrain_no_times:
        value: 100   # 水印注入的训练轮次
    global_projection_norm:
        value: 5.0   # 参数投影的范数约束
    # 恶意客户端检测相关参数
    VWM_detection_threshold:
        value: 85.0  # 水印检测的阈值，高于此值被认为是恶意客户端
    replace_original_bn:
        value: true  # 是否在检测时使用原始BN层参数
    # 模型聚合相关参数
    eta:
        value: 1.0   # 聚合时的学习率