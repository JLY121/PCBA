program: sweep_interface.py
method: grid
name: clean
metric:
    name: bkd_acc
    goal: maximize
parameters:
    attack_type:
        value: 'Our'  # A3FL/BadNets/Chameleon/Neurotoxin/Our
    dataset:
        value: 'cifar100'
    in_channels:         
        value: 3
    image_size:         
        value: 32
    model:
        value: 'resnet18'
    agg_method:
        value: 'alignins' # avg/clip/multi_krum/crfl/foolsgold/flame/feddmc/alignins
    is_poison:
        value: true
    load_benign_model:
        value: true
    seed:
        value: 321
    lr:
        value: 0.01
    gamma:
        value: 1
    lr_method:
        value: 'linear' # linear/exp/warmup_cosine
    target_lr:
        value: 0.02
    momentum: 
        value: 0.9
    decay: 
        value: 0.0005
    batch_size:
        value: 64
    test_batch_size:
        value: 1024
    num_worker:
        value: 0
    poison_start_epoch:
        value: 1100 #  ←  随时准备攻击，但只有在is_poison为True时才会真正开始攻击
    epochs:          # 总的训练轮次
        value: 3101
    poison_epochs:   #===攻击训练轮次===
        value: 100
    num_total_participants:    #参与FL的总客户端数
        value: 100
    num_adversaries:           #恶意客户端数
        value: 1
    num_sampled_participants:  #每轮参与FL的客户端数
        value: 10
    sample_method:             #客户端选择策略
        value: 'random'
    sample_poison_ratio:   #random_update中每轮参与FL的恶意客户端数
        value: 0
    dirichlet_alpha:
        value: 0.9         # 狄利克雷分布参数
    retrain_times:
        value: 2
    attacker_retrain_times:
        value: 2
    save_every:                #每隔多少轮保存一次模型
        value: 3101
    attacker_method:
        value: 'sin-adv'
    malicious_update_method:
        value: 'label'
    clip_factor:
        value: 1
    attacker_lr_decay:
        value: 5
    target_class:
        value: 2         # ----攻击类别：29号，恐龙；69号，火箭；----
    bkd_ratio:
        value: 0.25      # 每轮训练样本的中毒率
    trigger_outter_epochs:  #===寻找最优触发器的总训练轮次===
        value: 200
    trigger_lr:
        value: 0.01
    adv_loss:
        value: 'ce'
    dm_type:
        value: 'none'
    dm_adv_epochs:     #对抗模型训练轮数
        value: 5
    dm_adv_K:
        value: 1
    dm_adv_model_count:
        value: 1
    noise_model_count:
        value: 9
    noise_loss_lambda:
        value: 0.01
    wp_factor:
        value: 0.05
    trigger_epsilon:
        value: 2.0

#============ours_attacker相关参数=============
    SupCon_round1:    
        value: 2     # Encoder部分训练
    SupCon_round2:
        value: 2     # 分类器部分训练
    scale_weight:
        value: 6     # 提高中毒图像与促进者的权重（攻击标签对应的样本）
    down_scale_weight:
        value: 1     # 降低中毒图像与非促进者的权重（源类别对应的样本）
    trigger_size:
        value: 81   # DPOT掩码像素数量（如100，约占32x32图像的10%）
    blend_ratio:
        value: 1.0
    # ----params for Ablation Study----
    train_classifier:
        value: True  # 是否训练分类器阶段，True时两阶段都训练，False时只训练Encoder阶段

    #============Our Method Ablation Study=============
    is_optimize_mask:
        value: true
    is_optimize_trigger:
        value: true
    is_supcon:
        value: true
    two_stage_training:  ### 后门注入时是否先进行良性训练
        value: True
    

