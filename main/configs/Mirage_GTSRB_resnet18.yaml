program: sweep_interface.py
method: grid
name: clean
metric:
    name: bkd_acc
    goal: maximize
parameters:
    attack_type:
        value: 'Mirage'  # A3FL/BadNets/Chameleon/Neurotoxin/Our
    dataset:
        value: 'GTSRB' 
    in_channels:         
        value: 3
    image_size:         
        value: 32
    model:
        value: 'resnet18'
    agg_method:
        value: 'alignins' # avg/clip/multi_krum/crfl/foolsgold/flame/feddmc/alignins
    is_poison:
        value: true
    load_benign_model:
        value: true
    two_stage_training:  # 后门注入时是否先进行良性训练
        value: false
    seed:
        value: 42
    lr:
        value: 0.01
    gamma:
        value: 1
    lr_method:
        value: 'linear' # linear/exp/warmup_cosine
    target_lr:
        value: 0.02
    momentum: 
        value: 0.9
    decay: 
        value: 0.0005
    batch_size:
        value: 32
    test_batch_size:
        value: 1024
    num_worker:
        value: 0
    poison_start_epoch:
        value: 1000 #  ←  随时准备攻击，但只有在is_poison为True时才会真正开始攻击
    epochs:          # 总的训练轮次
        value: 3100 
    poison_epochs:   #===攻击训练轮次===
        value: 100
    num_total_participants:    #参与FL的总客户端数
        value: 100
    num_adversaries:           #恶意客户端数
        value: 1
    num_sampled_participants:  #每轮参与FL的客户端数
        value: 10
    sample_method:             #客户端选择策略
        value: 'random'
    sample_poison_ratio:   #random_update中每轮参与FL的恶意客户端数
        value: 0
    dirichlet_alpha:
        value: 0.9
    retrain_times:
        value: 2
    attacker_retrain_times:
        value: 2
    save_every:                #每隔多少轮保存一次模型
        value: 3005
    trigger_size_h:
        value: 7     # 触发器的高度
    trigger_size_w:
        value: 7     # 触发器的宽度
    attacker_method:
        value: 'sin-adv'
    malicious_update_method:
        value: 'label'
    clip_factor:
        value: 1
    attacker_lr_decay:
        value: 5
    target_class:         # target class
        value: 2
    bkd_ratio:            # poison ratio
        value: 0.25      
    trigger_outter_epochs:  
        value: 200
    trigger_lr:
        value: 0.01
    adv_loss:
        value: 'ce'
    dm_type:
        value: 'none'
    dm_adv_epochs:     #对抗模型训练轮数
        value: 5
    dm_adv_K:
        value: 1
    dm_adv_model_count:
        value: 1
    noise_model_count:
        value: 9
    noise_loss_lambda:
        value: 0.01
    wp_factor:
        value: 0.05
    trigger_epsilon:
        value: 2.0
# ----连续攻击的参数设置----
    continuous_attack:       # 是否开启连续攻击
        value: false
    continuous_attack_epochs:  # 连续攻击轮次
        value: 10
# ----Mirage攻击特有参数----
    trigger_search_no_times:     # 触发器搜索优化次数
        value: 50
    discriminator_class_num:     # 判别器用到的类别数（通常等于数据集类别数）
        value: 10
    discriminator_train_samples_pre_class:  # 每个类别用于训练判别器的样本数
        value: 50
    discriminator_batch_size:    # 判别器训练的批次大小
        value: 64               # 修正：与原始Mirage保持一致
    discriminator_lr:            # 判别器学习率
        value: 0.01             # 修正：与原始Mirage保持一致
    discriminator_momentum:      # 判别器优化器动量
        value: 0.9
    discriminator_weight_decay:  # 判别器权重衰减
        value: 0.0005
    discriminator_train_no_times: # 判别器训练轮数
        value: 30               # 修正：与原始Mirage保持一致
    mirage_discriminator_weight:  # 判别器损失权重（用于平衡隐蔽性）
        value: 1.0
    mirage_asr_weight:           # 攻击成功率损失权重
        value: 1.0
    mirage_sim_weight:           # 特征相似性损失权重（用于保持样本相似性）
        value: 1.0
    mask_type:                   # 触发器掩码类型：local(局部触发器) 或 global(全局触发器)
        value: 'local'
    blend_alpha:                 # 混合注入的透明度参数
        value: 0.3

