program: sweep_interface.py
method: grid
name: clean
metric:
    name: bkd_acc
    goal: maximize
parameters:
    attack_type:
        value: 'None'  # A3FL/BadNets/Chameleon/Neurotoxin/Our
    dataset:
        value: 'cifar10'
    in_channels:         
        value: 3
    image_size:
        value: 32
    model:
        # value: 'mobilenet_V2'
        # value: 'resnet18'
        value: 'vgg11_bn'
    agg_method:
        value: 'avg' # avg/clip/multi_krum/flame/feddmc/indicator/alignins
    is_poison:
        value: false
    load_benign_model:
        value: false
    epochs:          # 总的训练轮次
        value: 3001
    save_every:                #每隔多少轮保存一次模型
        value: 100
    two_stage_training:  # 后门注入时是否先进行良性训练
        value: false
    seed:
        value: 0
    lr:
        value: 0.01
    gamma:
        value: 1
    lr_method:
        value: 'linear' # linear/exp/warmup_cosine
    target_lr:
        value: 0.02  # ---
    momentum: 
        value: 0.9
    decay: 
        value: 0.0005
    batch_size:
        value: 64
    test_batch_size:
        value: 1024
    num_worker:
        value: 0
    poison_start_epoch:
        value: 1900 #  ←  随时准备攻击，但只有在is_poison为True时才会真正开始攻击
    poison_epochs:   #===攻击训练轮次===
        value: 100
    num_total_participants:    #参与FL的总客户端数
        value: 100
    num_adversaries:           #恶意客户端数
        value: 1
    num_sampled_participants:  #每轮参与FL的客户端数
        value: 10
    sample_method:             #客户端选择策略
        value: 'random'
    sample_poison_ratio:   #random_update中每轮参与FL的恶意客户端数
        value: 0
    dirichlet_alpha:
        value: 0.9
    retrain_times:
        value: 2
    attacker_retrain_times:
        value: 2
    attacker_method:
        value: 'sin-adv'
    malicious_update_method:
        value: 'label'
    clip_factor:
        value: 1
    attacker_lr_decay:
        value: 5
    target_class:         # target class
        value: 2
    bkd_ratio:            # poison ratio
        value: 0.25      
    wp_factor:
        value: 0.05
    # ============== FEDDMC 防御方法参数 ==============
    feddmc_pca_dim:      # PCA降维维度 - 控制特征压缩程度，越小压缩越多，计算更快但可能丢失信息
        value: 10
    feddmc_min_cluster_size:  # 最小聚类大小 - 控制异常值检测敏感度，越大越严格，可能误删良性客户端
        value: 3
    feddmc_save_tree:    # 是否保存聚类树图像用于调试分析
        value: false
    # ============== FEDDMC 多轮投票机制参数 ==============
    feddmc_window_size:  # 滑动窗口大小 - 保留多少轮的历史检测结果，越大越稳定但响应越慢
        value: 10
    feddmc_vote_threshold:  # 投票阈值 - 客户端被认定为恶意的投票比例阈值，越小越严格
        value: 0.5


    #============Indicator聚合方法相关参数=============
    # 水印检测轮次相关参数
    watermarking_start_round:
        value: 100  # 开始进行水印检测的轮次
    watermarking_end_round:
        value: 3000  # 结束水印检测的轮次
    watermarking_round_interval:
        value: 1    # 水印检测的间隔轮次
    # 水印注入相关参数
    watermarking_mu:
        value: 0.1  # 水印损失函数中的权重系数
    global_lr:
        value: 0.0001 # 水印注入时的学习率
    global_momentum:
        value: 0.9   # 水印注入时的动量
    global_weight_decay:
        value: 0.0005 # 水印注入时的权重衰减
    global_lr_gamma:
        value: 0.1   # 学习率衰减系数
    global_retrain_no_times:
        value: 50   # 水印注入的训练轮次
    global_projection_norm:
        value: 0.8   # 参数投影的范数约束
    # 恶意客户端检测相关参数
    VWM_detection_threshold:
        value: 85.0  # 水印检测的阈值，高于此值被认为是恶意客户端
    replace_original_bn:
        value: true  # 是否在检测时使用原始BN层参数
    # 模型聚合相关参数
    eta:
        value: 1.0   # 聚合时的学习率

    # ===测试攻击时刻相关参数===
    num_classes:
        values: [10]
    eval_batch_size:
        values: [128]
    datadir:
        value: '/Data/JLY/A3FL/main/datasets'

